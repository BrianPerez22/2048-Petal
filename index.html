  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Red de seguridad para GitHub Pages: si Pages sirve ESTE index.html sin compilar
      (Source = "Deploy from a branch / root"), el script de desarrollo de arriba da 404.
      En ese caso mandamos al juego ya compilado en ./docs/. En el build final y en
      `npm run dev` este bloque no hace nada.
    -->
    <script>
      (function () {
        var dev = document.querySelector('script[src*="/src/main.tsx"]');
        if (dev && /github\.io$/.test(location.hostname)) {
          location.replace('./docs/' + location.hash);
        }
      })();
    </script>
  </body>
